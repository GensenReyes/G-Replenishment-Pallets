<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Dashboard</title>
    <style>
        :root{
            --navy: #0f2436;
            --navy-2: #16324a;
            --blue: #2f6fa3;
            --blue-light: #e5eef5;
            --row-alt: #f4f8fb;
            --border: #d7e2ea;
            --text: #1c2b36;

            --muted: #5c7284;
            --accent-frozen: #3f7bbf;
            --accent-dry: #7a5c3f;
            --accent-produce: #3f9b5c;
            --accent-refrigerated: #287F8C;
            --bg: #eef2f5;

            --layout-mid:   #4F7D77;
        }

        *{ box-sizing: border-box; }

        body{ margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); }

        #dashboard {
            display: grid;
            height: 100vh;
            grid-template-columns: 1fr;
            grid-template-rows: 130px 1fr;
            background: var(--bg);
        }

        #home {
            display: grid;
            grid-template-columns: 130px 1fr;
            background: var(--navy);
        }

        /* Dashboard title */
        #title {
            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--navy);
            color: #ffffff;

            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* Four navigation icons */
        #nav {
            display: grid;
            grid-template-columns: repeat(2, 48px);
            grid-template-rows: repeat(2, 48px);
            align-content: center;
            justify-content: center;

            gap: 8px;
            padding: 8px;

            background: var(--navy);
        }

        /* Icon buttons */
        #nav a {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #dceae8;
            border: 2px solid transparent;
            border-radius: 7px;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        /* Images inside buttons */
        #nav a img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Mouse hover */
        #nav a:hover {
            background-color: #c5dcda;
            border-color: #8fb5b0;
            transform: translateY(-1px);
        }

        /* Keyboard focus */
        #nav a:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        /* Current page */
        #nav a.current-select {
            background-color: #ffffff;
            border-color: var(--layout-mid);
        }

        /* ---- Pallet storage, scrolls vertically through production lines ---- */
        #palletStorage {
            overflow-y: auto;
            padding: 18px 20px;
        }

        #palletSection{
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ---- One production line block ---- */
        .production-line{
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(15,36,54,0.06);
        }

        .production-line-header{
            background: var(--navy-2);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 10px 16px;
        }

        /* ---- One location lane (A or B) inside a production line ---- */
        .location-lane{
            padding: 10px 16px;
        }
        .location-lane + .location-lane{
            border-top: 1px solid var(--border);
        }

        .location-label{
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* horizontal scroll strip */
        .lane-scroll{
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .lane-scroll::-webkit-scrollbar{ height: 6px; }
        .lane-scroll::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 4px; }
        .lane-scroll::-webkit-scrollbar-track{ background: transparent; }

        /* ---- Compact pallet tile ---- */
        .pallet-tile{
            flex: 0 0 auto;
            width: 108px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .1s ease, box-shadow .1s ease;
        }
        .pallet-tile:hover{
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(15,36,54,0.15);
        }

        .tile-header{
            background: var(--navy);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tile-dot{
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tile-body{
            background: var(--blue-light);
            padding: 10px 6px;
            text-align: center;
        }
        .tile-name{
            font-size: 11px;
            font-weight: 700;
            color: var(--navy-2);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tile-spec{
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px;
        }

        /* ---- Pallet details pop-up ---- */
        .modal-overlay{
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(7, 20, 31, 0.68);
        }
        .modal-overlay.is-open{
            display: flex;
        }
        .pallet-modal{
            width: min(440px, 100%);
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 9px;
            box-shadow: 0 18px 50px rgba(7,20,31,0.3);
            animation: modalIn .16s ease-out;
        }
        @keyframes modalIn{
            from{ opacity: 0; transform: translateY(8px) scale(.98); }
            to{ opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header{
            min-height: 52px;
            padding: 10px 12px 10px 16px;
            border-left: 6px solid var(--accent-frozen);
            background: var(--navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .modal-heading{
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .modal-pallet-id{
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .3px;
        }
        .modal-type-pill{
            padding: 3px 9px;
            border-radius: 999px;
            background: #ff6600;
            color: white;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .modal-close{
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #fff;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-close:hover,
        .modal-close:focus-visible{
            background: rgba(255,255,255,.12);
            outline: none;
        }
        .modal-body{
            min-height: 160px;
            padding: 34px 20px;
            background: var(--blue-light);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-product-name{
            margin: 0;
            color: var(--navy-2);
            font-size: 24px;
            font-weight: 700;
        }
        .modal-product-spec{
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }
        .modal-footer{
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid var(--border);
        }
        .modal-footer-cell{
            padding: 12px 14px;
            background: var(--row-alt);
        }
        .modal-footer-cell + .modal-footer-cell{
            border-left: 1px solid var(--border);
            text-align: right;
        }
        .modal-footer-label{
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .modal-footer-value{
            display: block;
            margin-top: 2px;
            color: var(--navy-2);
            font-size: 14px;
            font-weight: 600;
        }
        body.modal-open{
            overflow: hidden;
        }

        /* ══════════════════════════════════════════════════════════════
           SMALL SCREENS
           ══════════════════════════════════════════════════════════════ */
        @media (max-width: 860px){
            body{ height: auto; }
            #dashboard{ height: auto; min-height: 100vh; display: block; }
            #home{ height: 56px; font-size: 16px; }
            #palletStorage{ overflow-y: visible; padding: 14px 14px 0; }
            .pallet-tile{ width: 96px; }

            .modal-overlay{ align-items: flex-end; padding: 0; }
            .pallet-modal{
                width: 100%;
                border-radius: 14px 14px 0 0;
                animation: sheetIn .18s ease-out;
            }
            @keyframes sheetIn{
                from{ opacity: 0; transform: translateY(24px); }
                to{ opacity: 1; transform: translateY(0); }
            }
        }
    </style>

        const typeColor = {
            "Frozen": "var(--accent-frozen)",
            "Dry": "var(--accent-dry)",
            "Produce": "var(--accent-produce)",
            "Deactivate": "var(--muted)"
        };

        function renderTile(pallet) {
            const color = typeColor[pallet.productType] || "var(--muted)";
            return `
                <div class="pallet-tile" id="${pallet.id}" data-pallet-id="${pallet.id}" role="button" tabindex="0" aria-label="View details for ${pallet.productName}">
                    <div class="tile-header">
                        <span>${pallet.id}</span>
                        <span class="tile-dot" style="background:${color}"></span>
                    </div>
                    <div class="tile-body">
                        <div class="tile-name">${pallet.productName}</div>
                        <div class="tile-spec">${pallet.spec}</div>
                    </div>
                </div>
            `;
        }

        // Group pallets by production line + location, then fill each lane
        const lanes = {};
        pallets.forEach(p => {
            const key = `${p.productionLine}-${p.lane}-scroll`;
            if (!lanes[key]) lanes[key] = [];
            lanes[key].push(p);
        });

        Object.entries(lanes).forEach(([laneId, list]) => {
            const el = document.getElementById(laneId);
            if (el) el.innerHTML = list.map(renderTile).join("");
        });

        // Open and close the pallet details pop-up
        const modal = document.getElementById("palletModal");
        const modalClose = document.getElementById("modalClose");
        let lastFocusedTile = null;

        function openPalletModal(pallet) {
            const accent = typeColor[pallet.productType] || "var(--accent-frozen)";

            document.getElementById("modalHeader").style.borderLeftColor = accent;
            document.getElementById("modalPalletId").textContent = pallet.id;
            document.getElementById("modalProductType").textContent = pallet.productType;
            document.getElementById("modalProductName").textContent = pallet.productName || "Empty";
            document.getElementById("modalProductSpec").textContent = pallet.spec || "No product specification";
            document.getElementById("modalPickZone").textContent = pallet.pickZone || "Not assigned";
            document.getElementById("modalLocation").textContent = pallet.location || "Not assigned";

            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            modalClose.focus();
        }

        function closePalletModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
            if (lastFocusedTile) lastFocusedTile.focus();
        }

        function selectPalletTile(tile) {
            const pallet = pallets.find(p => p.id === tile.dataset.palletId);
            if (!pallet) return;
            lastFocusedTile = tile;
            openPalletModal(pallet);
        }

        document.getElementById("palletSection").addEventListener("click", event => {
            const tile = event.target.closest(".pallet-tile");
            if (tile) selectPalletTile(tile);
        });

        document.getElementById("palletSection").addEventListener("keydown", event => {
            const tile = event.target.closest(".pallet-tile");
            if (tile && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                selectPalletTile(tile);
            }
        });

        modalClose.addEventListener("click", closePalletModal);

        modal.addEventListener("click", event => {
            if (event.target === modal) closePalletModal();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && modal.classList.contains("is-open")) {
                closePalletModal();
            }
        });
