<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Dashboard</title>
    <style>
        :root{
            --navy: #0f2436;
            --navy-2: #16324a;
            --blue: #2f6fa3;
            --blue-light: #e5eef5;
            --row-alt: #f4f8fb;
            --border: #d7e2ea;
            --text: #1c2b36;
            --muted: #5c7284;
            --accent-frozen: #3f7bbf;
            --accent-dry: #7a5c3f;
            --accent-produce: #3f9b5c;
            --bg: #eef2f5;

            /* Layout / rack section — a deliberately different color
               family from --navy, so it reads as "this is the rack
               layout, not a pallet" */
             --layout-dark:  #355C57;
            --layout-mid:   #4F7D77;
            --layout-light: #E8F1EF;
        }

        *{ box-sizing: border-box; }

        body{ margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); }

        #dashboard{
            display: grid;
            height: 100vh;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 64px 1fr 90px;
            background: var(--bg);

        }

        /* ---- Top bar ---- */
        #home {
            display: flex;
            flex-direction: row;
            justify-content: center;
            grid-column: span 2;
            background: var(--navy);
            display: flex;
            align-items: center;   
            padding: 0 24px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* ---- Left: pallet storage, scrolls vertically through production lines ---- */
        #palletStorage {
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding: 18px 20px;
        }

        #palletSection{
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ---- One production line block ---- */
        .production-line{
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(15,36,54,0.06);
        }

        .production-line-header{
            background: var(--navy-2);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 10px 16px;
        }

        /* ---- One location lane (A or B) inside a production line ---- */
        .location-lane{
            padding: 10px 16px;
        }
        .location-lane + .location-lane{
            border-top: 1px solid var(--border);
        }

        .location-label{
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* horizontal scroll strip */
        .lane-scroll{
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .lane-scroll::-webkit-scrollbar{ height: 6px; }
        .lane-scroll::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 4px; }
        .lane-scroll::-webkit-scrollbar-track{ background: transparent; }

        /* ---- Compact pallet tile ---- */
        .pallet-tile{
            flex: 0 0 auto;
            width: 108px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .1s ease, box-shadow .1s ease;
        }
        .pallet-tile:hover{
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(15,36,54,0.15);
        }

        .tile-header{
            background: var(--navy);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tile-dot{
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tile-body{
            background: var(--blue-light);
            padding: 10px 6px;
            text-align: center;
        }
        .tile-name{
            font-size: 11px;
            font-weight: 700;
            color: var(--navy-2);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tile-spec{
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px;
        }

        /* ---- Right panel (clanogram / pick-zone view) ---- */
        #layoutBackPics {
            overflow-y: auto;
            padding: 18px 20px;
            border-left: 1px solid var(--border);
        }
        #layoutBackPics .placeholder-label{
            font-size: 13px;
            color: var(--muted);
            font-style: italic;
        }

        /* ---- Planogram / pick-zone panel ---- */
        #planogramSection{
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        /* "Layout" — encloses one rack's worth of pick zones. There can
           be more than one (e.g. a second rack elsewhere in the
           building), each rendered as its own layout-group. */
        .layout-group{
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(15,36,54,0.06);
        }

        .layout-header{
            background: var(--layout-dark);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 12px 16px;
        }

        .layout-zones{
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
        }

        .planogram-zone{
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .planogram-zone-header{
            background: var(--layout-mid);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 8px 14px;
        }

        .planogram-row{
            display: grid;
            grid-template-columns: repeat(var(--cols, 4), 1fr);
        }
        .planogram-row + .planogram-row{
            border-top: 1px solid var(--border);
        }

        .planogram-cell{
            padding: 8px 10px 10px;
            border-left: 1px solid var(--border);
            min-width: 0;
        }
        .planogram-cell:first-child{
            border-left: 0;
        }
        .planogram-cell.is-empty{
            background: var(--row-alt);
        }
        .planogram-cell:not(.is-empty){
            cursor: pointer;
            transition: background .1s ease;
        }
        .planogram-cell:not(.is-empty):hover,
        .planogram-cell:not(.is-empty):focus-visible{
            background: var(--layout-light);
            outline: none;
        }

        .cell-location{
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: var(--layout-mid);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .cell-product{
            font-size: 12px;
            font-weight: 700;
            color: var(--navy-2);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .cell-spec{
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }
        .cell-itemid{
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ---- Bottom strip: rack overview ---- */
        #layoutRack {
            grid-column: span 2;
            background: #fff;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            color: var(--muted);
        }

        /* ---- Pallet details pop-up ---- */
        .modal-overlay{
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(7, 20, 31, 0.68);
        }
        .modal-overlay.is-open{
            display: flex;
        }
        .pallet-modal{
            width: min(440px, 100%);
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 9px;
            box-shadow: 0 18px 50px rgba(7,20,31,0.3);
            animation: modalIn .16s ease-out;
        }
        @keyframes modalIn{
            from{ opacity: 0; transform: translateY(8px) scale(.98); }
            to{ opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header{
            min-height: 52px;
            padding: 10px 12px 10px 16px;
            border-left: 6px solid var(--accent-frozen);
            background: var(--navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .modal-heading{
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .modal-pallet-id{
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .3px;
        }
        .modal-type-pill{
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(255,255,255,.12);
            color: #cfe3f5;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .modal-close{
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #fff;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-close:hover,
        .modal-close:focus-visible{
            background: rgba(255,255,255,.12);
            outline: none;
        }
        .modal-body{
            min-height: 160px;
            padding: 34px 20px;
            background: var(--blue-light);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-product-name{
            margin: 0;
            color: var(--navy-2);
            font-size: 24px;
            font-weight: 700;
        }
        .modal-product-spec{
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }
        .modal-footer{
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid var(--border);
        }
        .modal-footer-cell{
            padding: 12px 14px;
            background: var(--row-alt);
        }
        .modal-footer-cell + .modal-footer-cell{
            border-left: 1px solid var(--border);
            text-align: right;
        }
        .modal-footer-label{
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .modal-footer-value{
            display: block;
            margin-top: 2px;
            color: var(--navy-2);
            font-size: 14px;
            font-weight: 600;
        }
        body.modal-open{
            overflow: hidden;
        }

        /* ══════════════════════════════════════════════════════════════
           SMALL SCREENS
           Below this width: stop trying to cram the desktop grid in —
           stack everything, let the page scroll naturally, and shrink
           the planogram down to something tappable while KEEPING the
           real rack shape (row/column counts never change — that's the
           actual physical layout the picker is scanning against).
           ══════════════════════════════════════════════════════════════ */
        @media (max-width: 860px){
            body{
                height: auto;
            }
            #dashboard{
                height: auto;
                min-height: 100vh;
                display: block;
            }
            #home{
                height: 56px;
                font-size: 16px;
            }
            #palletStorage,
            #layoutBackPics{
                overflow-y: visible;
                border: 0;
                padding: 14px 14px 0;
            }
            #layoutBackPics{
                border-top: 1px solid var(--border);
                margin-top: 4px;
                padding-top: 18px;
            }
            #layoutRack{
                padding: 12px 14px;
                height: auto;
            }

            /* Pallet tiles: a touch bigger so they're easy to tap */
            .pallet-tile{ width: 96px; }

            /* Planogram: shrink each slot down to a compact "light"
               showing just the location number; full product info opens
               in the tap popup instead of trying to fit on the shelf */
            .planogram-cell{
                padding: 6px 3px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 46px;
                text-align: center;
            }
            .cell-location{
                margin-bottom: 0;
                font-size: 12px;
                padding: 3px 0;
                width: 100%;
            }
            .cell-product,
            .cell-spec,
            .cell-itemid{
                display: none;
            }

            /* Popups become a bottom sheet instead of a centered card —
               easier to reach with a thumb and avoids tiny cramped modals */
            .modal-overlay{
                align-items: flex-end;
                padding: 0;
            }
            .pallet-modal{
                width: 100%;
                border-radius: 14px 14px 0 0;
                animation: sheetIn .18s ease-out;
            }
            @keyframes sheetIn{
                from{ opacity: 0; transform: translateY(24px); }
                to{ opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <div id="home">Replenishment Dashboard</div>

        <div id="palletStorage">
            <div id="palletSection">
                <!-- Production Line 1 -->
                <div class="production-line" id="production-1">
                    <div class="production-line-header">Zone 1</div>

                    <div class="location-lane" id="production-1-B">
                        <div class="location-label">Location B</div>
                        <div class="lane-scroll" id="production-1-B-scroll">
                            <!-- pallet tiles injected here by JS -->
                        </div>
                    </div>
                </div>

                <!-- Production Line 2 -->
                <div class="production-line" id="production-2">
                    <div class="production-line-header">Zone  2</div>

                    <div class="location-lane" id="production-2-A">
                        <div class="location-label">Location A</div>
                        <div class="lane-scroll" id="production-2-A-scroll"></div>
                    </div>

                    <div class="location-lane" id="production-2-B">
                        <div class="location-label">Location B</div>
                        <div class="lane-scroll" id="production-2-B-scroll"></div>
                    </div>
                </div>
                <!-- Production Line 3 -->
                <div class="production-line" id="production-3">
                    <div class="production-line-header">Zone  3</div>

                    <div class="location-lane" id="production-3-A">
                        <div class="location-label">Location A</div>
                        <div class="lane-scroll" id="production-3-A-scroll"></div>
                    </div>
                </div> 
                <!-- Production Line 4 -->
                <div class="production-line" id="production-4">
                    <div class="production-line-header">Zone  4</div>

                    <div class="location-lane" id="production-4-A">
                        <div class="location-label">Location A</div>
                        <div class="lane-scroll" id="production-4-A-scroll"></div>
                    </div>
                </div>
                <!-- Production Line 5 -->
                <div class="production-line" id="production-5">
                    <div class="production-line-header">Zone  5</div>

                    <div class="location-lane" id="production-5-A">
                        <div class="location-label">Location A</div>
                        <div class="lane-scroll" id="production-5-A-scroll"></div>
                    </div>

                    <div class="location-lane" id="production-5-B">
                        <div class="location-label">Location B</div>
                        <div class="lane-scroll" id="production-5-B-scroll"></div>
                    </div>
                </div>                 

                <!-- Freezer Rack -->
                <div class="production-line" id="freezer">
                    <div class="production-line-header">Freezer Rack</div>

                    <div class="location-lane" id="freezer-A">
                        <div class="location-label">Location A</div>
                        <div class="lane-scroll" id="freezer-A-scroll"></div>
                    </div>
                    <div class="location-lane" id="freezer-B">
                        <div class="location-label">Location B</div>
                        <div class="lane-scroll" id="freezer-B-scroll"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="layoutBackPics">
            <div id="planogramSection">
                <!-- pick-zone grids injected here by JS -->
            </div>
        </div>

        <div id="layoutRack">Rack overview / summary strip goes here</div>
    </div>

    <div class="modal-overlay" id="palletModal" aria-hidden="true">
        <section class="pallet-modal" role="dialog" aria-modal="true" aria-labelledby="modalProductName">
            <div class="modal-header" id="modalHeader">
                <div class="modal-heading">
                    <span class="modal-pallet-id" id="modalPalletId"></span>
                    <span class="modal-type-pill" id="modalProductType"></span>
                </div>
                <button class="modal-close" id="modalClose" type="button" aria-label="Close pallet details">&times;</button>
            </div>
            <div class="modal-body">
                <h2 class="modal-product-name" id="modalProductName"></h2>
                <p class="modal-product-spec" id="modalProductSpec"></p>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-cell">
                    <span class="modal-footer-label">Pick Zone</span>
                    <span class="modal-footer-value" id="modalPickZone"></span>
                </div>
                <div class="modal-footer-cell">
                    <span class="modal-footer-label">Location</span>
                    <span class="modal-footer-value" id="modalLocation"></span>
                </div>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="planogramModal" aria-hidden="true">
        <section class="pallet-modal" role="dialog" aria-modal="true" aria-labelledby="planoModalProductName">
            <div class="modal-header" id="planoModalHeader" style="border-left-color: var(--layout-mid); background: var(--layout-dark);">
                <div class="modal-heading">
                    <span class="modal-pallet-id" id="planoModalLocation"></span>
                    <span class="modal-type-pill" id="planoModalZone"></span>
                </div>
                <button class="modal-close" id="planoModalClose" type="button" aria-label="Close location details">&times;</button>
            </div>
            <div class="modal-body">
                <h2 class="modal-product-name" id="planoModalProductName"></h2>
                <p class="modal-product-spec" id="planoModalProductSpec"></p>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-cell">
                    <span class="modal-footer-label">Demand</span>
                    <span class="modal-footer-value" id="planoModalItemId"></span>
                </div>
                <div class="modal-footer-cell">
                    <span class="modal-footer-label">Location</span>
                    <span class="modal-footer-value" id="planoModalLocationValue"></span>
                </div>
            </div>
        </section>
    </div>


    <script>
        // ╔══════════════════════════════════════════════════════════════╗
        // ║                                                                ║
        // ║                    ⚠   R E S T R I C T E D                    ║
        // ║                         E D I T   Z O N E                      ║
        // ║                                                                ║
        // ║  ──────────────────────────────────────────────────────────  ║
        // ║                                                                ║
        // ║   You may ONLY edit the pallet list directly below this        ║
        // ║   banner. Everything above powers the layout — leave it        ║
        // ║   untouched.                                                    ║
        // ║                                                                ║
        // ║     +  Add a pallet     →  copy a line, change the values      ║
        // ║     −  Remove a pallet  →  delete its line                     ║
        // ║                                                                ║
        // ╚══════════════════════════════════════════════════════════════╝

        class Pallet {
            constructor(id, productName, spec, productType, productionLine, lane, pickZone, location) {
                this.id = id;
                this.productName = productName;
                this.spec = spec;
                this.productType = productType; // "Frozen" | "Dry" | "Produce"
                this.productionLine = productionLine; // e.g. "production-1"
                this.lane = lane; // "A" or "B" — controls which dashboard row it appears in
                this.pickZone = pickZone; // shown inside the pop-up
                this.location = location; // shown inside the pop-up
            }
        }

        const pallets = [
            // ╔══════════════════════════════════════════════════════════════╗
            // ║                         Z O N E   1                          ║
            // ╚══════════════════════════════════════════════════════════════╝
            new Pallet("Z1-B1", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B2", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B3", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B4", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B5", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B6", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B7", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B8", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B9", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B10", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B11", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B12", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B13", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B14", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B15", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B16", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B17", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B18", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B19", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B20", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B21", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B22", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B23", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B24", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B25", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B26", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B27", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B28", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B29", "", "", "", "production-1", "B", "", ""),
            new Pallet("Z1-B30", "", "", "", "production-1", "B", "", ""),
            // ╔══════════════════════════════════════════════════════════════╗
            // ║                         Z O N E   2                          ║
            // ╚══════════════════════════════════════════════════════════════╝
            new Pallet("Z2-A1", "", "", "", "production-2", "A", "", ""),
            new Pallet("Z2-A2", "", "", "", "production-2", "A", "", ""),
            new Pallet("Z2-A3", "", "", "", "production-2", "A", "", ""),
            new Pallet("Z2-A4", "", "", "", "production-2", "A", "", ""),
            new Pallet("Z2-A5", "", "", "", "production-2", "A", "", ""),

        function renderPlanogramCell(cell, layoutName, zoneNum) {
            if (!cell) {
                return `<div class="planogram-cell is-empty"></div>`;
            }
            return `
                <div class="planogram-cell" data-layout="${layoutName}" data-zone="${zoneNum}" data-location="${cell.location}" role="button" tabindex="0" aria-label="View details for location ${cell.location}">
                    <span class="cell-location">Location: ${cell.location}</span>
                    <div class="cell-product">${cell.product}</div>
                    <div class="cell-spec">${cell.spec}</div>
                    <div class="cell-itemid">Demand: ${cell.itemId}</div>
                </div>
            `;
        }

        function renderPlanogramZone(pickZone, layoutName) {
            const rowsHtml = pickZone.rows.map(row => `
                <div class="planogram-row" style="--cols: ${row.length};">
                    ${row.map(cell => renderPlanogramCell(cell, layoutName, pickZone.zone)).join("")}
                </div>
            `).join("");

            return `
                <div class="planogram-zone">
                    <div class="planogram-zone-header">Pick Zone ${pickZone.zone}</div>
                    ${rowsHtml}
                </div>
            `;
        }

        function renderLayoutGroup(layout) {
            const zonesHtml = layout.pickZones.map(pz => renderPlanogramZone(pz, layout.name)).join("");
            return `
                <div class="layout-group">
                    <div class="layout-header">${layout.name}</div>
                    <div class="layout-zones">${zonesHtml}</div>
                </div>
            `;
        }

        const planogramEl = document.getElementById("planogramSection");
        if (planogramEl) {
            planogramEl.innerHTML = layouts.map(renderLayoutGroup).join("");
        }

        // Flat lookup so a tapped cell can find its own data quickly
        const planogramCellMap = {};
        layouts.forEach(layout => {
            layout.pickZones.forEach(pz => {
                pz.rows.forEach(row => {
                    row.forEach(cell => {
                        if (cell) planogramCellMap[`${layout.name}-${pz.zone}-${cell.location}`] = cell;
                    });
                });
            });
        });

        // Open and close the planogram (pick-zone) details pop-up
        const planogramModal = document.getElementById("planogramModal");
        const planogramModalClose = document.getElementById("planoModalClose");
        let lastFocusedCell = null;

        function openPlanogramModal(cell, layoutName, zoneNum) {
            document.getElementById("planoModalLocation").textContent = `Location ${cell.location}`;
            document.getElementById("planoModalZone").textContent = `${layoutName} · Pick Zone ${zoneNum}`;
            document.getElementById("planoModalProductName").textContent = cell.product;
            document.getElementById("planoModalProductSpec").textContent = cell.spec;
            document.getElementById("planoModalItemId").textContent = cell.itemId;
            document.getElementById("planoModalLocationValue").textContent = cell.location;

            planogramModal.classList.add("is-open");
            planogramModal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            planogramModalClose.focus();
        }

        function closePlanogramModal() {
            planogramModal.classList.remove("is-open");
            planogramModal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
            if (lastFocusedCell) lastFocusedCell.focus();
        }

        function selectPlanogramCell(cellEl) {
            const cell = planogramCellMap[`${cellEl.dataset.layout}-${cellEl.dataset.zone}-${cellEl.dataset.location}`];
            if (!cell) return;
            lastFocusedCell = cellEl;
            openPlanogramModal(cell, cellEl.dataset.layout, cellEl.dataset.zone);
        }

        if (planogramEl) {
            planogramEl.addEventListener("click", event => {
                const cellEl = event.target.closest(".planogram-cell:not(.is-empty)");
                if (cellEl) selectPlanogramCell(cellEl);
            });
            planogramEl.addEventListener("keydown", event => {
                const cellEl = event.target.closest(".planogram-cell:not(.is-empty)");
                if (cellEl && (event.key === "Enter" || event.key === " ")) {
                    event.preventDefault();
                    selectPlanogramCell(cellEl);
                }
            });
        }

        planogramModalClose.addEventListener("click", closePlanogramModal);

        planogramModal.addEventListener("click", event => {
            if (event.target === planogramModal) closePlanogramModal();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && planogramModal.classList.contains("is-open")) {
                closePlanogramModal();
            }
        });

        const typeColor = {
            "Frozen": "var(--accent-frozen)",
            "Dry": "var(--accent-dry)",
            "Produce": "var(--accent-produce)"
        };

        function renderTile(pallet) {
            const color = typeColor[pallet.productType] || "var(--accent-frozen)";
            return `
                <div class="pallet-tile" id="${pallet.id}" data-pallet-id="${pallet.id}" role="button" tabindex="0" aria-label="View details for ${pallet.productName}">
                    <div class="tile-header">
                        <span>${pallet.id}</span>
                        <span class="tile-dot" style="background:${color}"></span>
                    </div>
                    <div class="tile-body">
                        <div class="tile-name">${pallet.productName}</div>
                        <div class="tile-spec">${pallet.spec}</div>
                    </div>
                </div>
            `;
        }

        // Group pallets by production line + location, then fill each lane
        const lanes = {};
        pallets.forEach(p => {
            const key = `${p.productionLine}-${p.lane}-scroll`;
            if (!lanes[key]) lanes[key] = [];
            lanes[key].push(p);
        });

        Object.entries(lanes).forEach(([laneId, list]) => {
            const el = document.getElementById(laneId);
            if (el) el.innerHTML = list.map(renderTile).join("");
        });

        // Open and close the pallet details pop-up
        const modal = document.getElementById("palletModal");
        const modalClose = document.getElementById("modalClose");
        let lastFocusedTile = null;

        function openPalletModal(pallet) {
            const accent = typeColor[pallet.productType] || "var(--accent-frozen)";

            document.getElementById("modalHeader").style.borderLeftColor = accent;
            document.getElementById("modalPalletId").textContent = pallet.id;
            document.getElementById("modalProductType").textContent = pallet.productType;
            document.getElementById("modalProductName").textContent = pallet.productName || "Empty";
            document.getElementById("modalProductSpec").textContent = pallet.spec || "No product specification";
            document.getElementById("modalPickZone").textContent = pallet.pickZone || "Not assigned";
            document.getElementById("modalLocation").textContent = pallet.location || "Not assigned";

            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            modalClose.focus();
        }

        function closePalletModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
            if (lastFocusedTile) lastFocusedTile.focus();
        }

        function selectPalletTile(tile) {
            const pallet = pallets.find(p => p.id === tile.dataset.palletId);
            if (!pallet) return;
            lastFocusedTile = tile;
            openPalletModal(pallet);
        }

        document.getElementById("palletSection").addEventListener("click", event => {
            const tile = event.target.closest(".pallet-tile");
            if (tile) selectPalletTile(tile);
        });

        document.getElementById("palletSection").addEventListener("keydown", event => {
            const tile = event.target.closest(".pallet-tile");
            if (tile && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                selectPalletTile(tile);
            }
        });

        modalClose.addEventListener("click", closePalletModal);

        modal.addEventListener("click", event => {
            if (event.target === modal) closePalletModal();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && modal.classList.contains("is-open")) {
                closePalletModal();
            }
        });
    </script>
</body>
</html>
